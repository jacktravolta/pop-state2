services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pop
      POSTGRES_PASSWORD: pop
      POSTGRES_DB: pop_estate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pop"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  mailer:
    image: mailhog/mailhog
  app:
    build: .
    entrypoint: ["sh", "./docker/entrypoint.sh"]
    command: ["php-fpm"]
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
volumes:
  pgdata:
